name: Beekip 24/7 Autonomous Crawler & Ingestion

on:
  schedule:
    # UTC -> Vietnam: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00.
    - cron: '0 1,5,9,13,17,21 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight reads Cloudflare; ingest writes documents; deploy-edge deploys beekip-crawl-hub Worker'
        type: choice
        options: [preflight, ingest, deploy-edge]
        default: preflight

permissions:
  contents: read

concurrency:
  group: beekip-cloud-crawler
  cancel-in-progress: false

jobs:
  crawl_and_sync:
    if: github.event_name == 'workflow_dispatch' || vars.BEEKIP_CLOUD_ENABLED == 'true'
    runs-on: ubuntu-24.04
    # 6 runs/day * 31 days * 8 min = 1,488 min, excluding other/manual runs.
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      BEEKIP_DATA_DIR: /tmp/beekip-cloud-data
      MAX_WORKER_THREADS: '1'
      MAX_DOMAIN_CONCURRENCY: '1'
      MIN_DOMAIN_DELAY_SECONDS: '2.5'
      MAX_DOMAIN_DELAY_SECONDS: '3.5'

    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements-cloud.txt

      - name: Regression checks without cloud writes
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Deploy Cloudflare Edge Worker (beekip-crawl-hub)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy-edge'
        working-directory: cloudflare-edge-dashboard
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 deploy --keep-vars

      - name: Run Beekip Delta Ingestion Cycle (>= 2023)
        if: inputs.mode != 'deploy-edge'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          BEEKIP_BASE_URL: ${{ vars.BEEKIP_BASE_URL || 'https://tailieu.beekip.vn' }}
          DOCUMENT_INGEST_TOKEN: ${{ secrets.DOCUMENT_INGEST_TOKEN }}
          DOCUMENT_INGEST_BASE_URL: ${{ vars.DOCUMENT_INGEST_BASE_URL || 'https://tailieu.beekip.vn' }}
          BEEKIP_CLOUD_ENABLED: ${{ vars.BEEKIP_CLOUD_ENABLED }}
          CLOUD_MODE: ${{ inputs.mode || 'ingest' }}
        run: |
          timeout --signal=TERM --kill-after=10s 330s python -m services.run_cloud_cycle --mode "$CLOUD_MODE"
